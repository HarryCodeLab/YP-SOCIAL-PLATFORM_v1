<style>
/* CSS Styling */
.upload-container {
  font-family: serif;
  display: flex;
  font-size: 13px;
  flex-direction: column;
  gap: 15px;
  max-width: 90%;
}

preview-box {
  width: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  overflow: hidden;
}

input, button { display: block; width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; padding: 12px; font-size: 22px; font-weight: bold;}

  display: none;
}

<hr>

<div class="upload-container">
  <hr>
  
<form action ="/upload_profile_pic_to_cloudinary" method ="POST" enctype="multipart/form-data">  

  <input type="file" id="file-chooser" name="profile_pic" accept="image/*">
  
  <div class="preview-box">
  
    <img id="image-preview" src="" alt="Image Preview" style="border-radius:50%; width:90%;" class="hidden">
    <span style= "color:red; font-family:monospace; font-size: 22px; font-weight:bold;" id="placeholder-text">No image selected yet</span>
    <br>
    <button type="submit" class="btn-upload">UPLOAD PROFILE PIC</button>
    
</form>
    
  </div>
</div>

<script>
const fileChooser = document.getElementById('file-chooser');
const imagePreview = document.getElementById('image-preview');
const placeholderText = document.getElementById('placeholder-text');

fileChooser.addEventListener('change', function() {
  const file = this.files[0]; // Damn bro! JavaScript is so damn hard. But atleast I'm nailing it. whoo-hoo

  if (file) {

    const objectURL = URL.createObjectURL(file);
    
    imagePreview.src = objectURL;
    
    imagePreview.classList.remove('hidden');
    placeholderText.classList.add('hidden');
  } else { //I never knew if-else in JS could be this confusing. I'm used to Python
  
    imagePreview.src = "";
    imagePreview.classList.add('hidden');
    placeholderText.classList.remove('hidden');
  }
});
</script>
